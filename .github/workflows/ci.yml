name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  python:
    name: Python tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tests
        run: python3 -m unittest tests/test_codex_desktop_usb_light.py

  firmware:
    name: ESP32-C3 firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run firmware logic tests
        run: |
          g++ -std=c++17 -I firmware/TrafficLightStatus firmware/TrafficLightStatus/test_status_logic.cpp -o /tmp/test_status_logic
          /tmp/test_status_logic

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Compile firmware
        run: arduino-cli compile --fqbn esp32:esp32:esp32c3 firmware/TrafficLightStatus
